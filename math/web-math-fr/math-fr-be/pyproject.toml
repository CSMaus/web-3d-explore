[project]
name = "math-fr-be"
version = "0.1.0"
description = "backend for the fractals site: accounts, stored parameter sets, equation metadata and export renders"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.137.2,<1.0.0",
    "uvicorn[standard]>=0.49.0,<1.0.0",
    "sqlalchemy>=2.0.51,<3.0.0",
    "alembic>=1.18.4,<2.0.0",
    "psycopg[binary]>=3.3.4,<4.0.0",
    "pydantic[email]>=2.13.4,<3.0.0",
    "pydantic-settings>=2.14.1,<3.0.0",
    "numpy>=2.4.6,<3.0.0",
    "scipy>=1.17.0,<1.18.0",
    "python-dotenv>=1.2.2,<2.0.0",
    "argon2-cffi>=25.1.0,<26.0.0",
    "pillow>=12.3.0,<13.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "httpx2>=2.12.0,<3.0.0",
    "ruff>=0.15.0,<1.0.0",
    "mypy>=1.17,<2.0.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body",
  "fastapi.Header", "fastapi.File", "fastapi.Form", "fastapi.Cookie",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
