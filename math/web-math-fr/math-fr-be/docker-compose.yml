services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-mathfr}
      POSTGRES_USER: ${DB_USER:-mathfr}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mathfr-local}
    ports:
      - "${DB_PORT:-1586}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mathfr} -d ${DB_NAME:-mathfr}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      APP_CONFIG__DB__HOST: db
      APP_CONFIG__DB__PORT: 5432
      APP_CONFIG__DB__NAME: ${DB_NAME:-mathfr}
      APP_CONFIG__DB__USER: ${DB_USER:-mathfr}
      DB_PASSWORD: ${DB_PASSWORD:-mathfr-local}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-1585}:1585"

volumes:
  pgdata:
